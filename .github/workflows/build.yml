name: Build Shlose

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS universal)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          find build -name "Shlose.vst3" -type d -exec codesign --force --deep -s - {} \;

      - name: Collect
        shell: bash
        run: |
          mkdir out
          find build -name "Shlose.vst3" -maxdepth 6 -exec cp -R {} out/ \;
          ls -R out | head -50

      - uses: actions/upload-artifact@v4
        with:
          name: Shlose-VST3-${{ runner.os }}
          path: out
